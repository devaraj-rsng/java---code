---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: fb-deploy
  labels: 
    app: fb-deploy
spec: 
  selector: 
    matchLabels:
      app: facebook
  replicas: 2
  template: 
    metadata:
      name: fb-pod
      labels: 
        app: facebook
    spec: 
      containers: 
        - name: fb-image
          image: devaraj3007/devopsproject:17